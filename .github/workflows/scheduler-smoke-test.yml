name: GitPulse scheduler smoke test

# Operations temporarily paused at the owner's request.
# Previous UTC schedule: 2-57/5 * * * *.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Show scheduler event
        run: |
          echo "event=${{ github.event_name }}"
          echo "scheduled_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
