name: GitPulse scheduler smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Show scheduler event
        run: |
          echo "event=${{ github.event_name }}"
          echo "scheduled_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
