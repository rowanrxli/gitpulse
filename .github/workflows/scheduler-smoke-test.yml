name: GitPulse scheduler smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Run at odd minutes to avoid GitHub's busiest top-of-hour window.
    - cron: "2-57/5 * * * *"

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Show scheduler event
        run: |
          echo "event=${{ github.event_name }}"
          echo "scheduled_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
