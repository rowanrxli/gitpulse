name: GitPulse daily sync

# Operations temporarily paused at the owner's request.
# Previous UTC schedules: 17 9 * * * and 22 9 * * *.
# To resume, restore those schedule triggers and the job condition below.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitpulse-collection
  cancel-in-progress: false

jobs:
  sync:
    # Paused: previously vars.GITPULSE_SCHEDULER_ENABLED == 'true'.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Continue GitPulse sync
        env:
          GITPULSE_ORIGIN: ${{ vars.GITPULSE_ORIGIN }}
          SYNC_CRON_SECRET: ${{ secrets.SYNC_CRON_SECRET }}
        run: node scripts/run-sync.mjs
